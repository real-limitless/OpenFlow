# Production overlay — use with the base compose file:
#   POSTGRES_PASSWORD=$(openssl rand -hex 24)
#   REDIS_PASSWORD=$(openssl rand -hex 24)
#   CREDENTIALS_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# POSTGRES_PASSWORD and REDIS_PASSWORD are required and must not be dev defaults
# or CREDENTIALS_KEY. Compose builds DATABASE_URL from POSTGRES_*. REDIS_URL is
# built from REDIS_PASSWORD. Do not set DATABASE_URL for this stack.
# db and redis are on the internal backend network and publish no host ports.
#
# Existing volumes keep the password they were initialized with. See docs/install.md
# for the ALTER USER migration.
#
# Do not expose this stack on the public internet without TLS in front of the API.

services:
  api:
    environment:
      # Literals so a try-out .env (AUTH_DISABLED=true) cannot silently win
      AUTH_DISABLED: "false"
      OPENFLOW_OPEN_REGISTER: "false"
      # Opt in for one first-owner bootstrap, then set it back to false.
      OPENFLOW_ALLOW_FIRST_OWNER: ${OPENFLOW_ALLOW_FIRST_OWNER:-false}
      OPENFLOW_HOT_NODES: "false"
      NODE_ENV: production
      OPENFLOW_CORS_ORIGINS: ${OPENFLOW_CORS_ORIGINS:-}
      OPENFLOW_OIDC_ISSUER: ${OPENFLOW_OIDC_ISSUER:-}
      OPENFLOW_OIDC_CLIENT_ID: ${OPENFLOW_OIDC_CLIENT_ID:-}
      OPENFLOW_OIDC_CLIENT_SECRET: ${OPENFLOW_OIDC_CLIENT_SECRET:-}
      OPENFLOW_OIDC_REDIRECT_URI: ${OPENFLOW_OIDC_REDIRECT_URI:-}
      OPENFLOW_OIDC_ENABLED: ${OPENFLOW_OIDC_ENABLED:-}
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}@db:5432/${POSTGRES_DB:-openflow}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?Set CREDENTIALS_KEY}
      BINARY_STORAGE_DIR: /data/binary
      OPENFLOW_SECRETS_DIR: /data/secrets
      OPENFLOW_ROLE: main
      RUN_WORKER: "false"
    restart: unless-stopped
    # No host port. Attach a reverse proxy to the `api` network, or add
    # docker-compose.local-ports.yml for loopback-only local use.

  worker:
    environment:
      AUTH_DISABLED: "false"
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}@db:5432/${POSTGRES_DB:-openflow}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?Set CREDENTIALS_KEY}
      OPENFLOW_ROLE: worker
      RUN_WORKER: "true"
    restart: unless-stopped

  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}
    # Reject the dev default before Postgres accepts connections. `:?` only
    # catches an unset variable; this catches POSTGRES_PASSWORD=openflow.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pw=$$(printf '%s' "$$POSTGRES_PASSWORD" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        case "$$pw" in
          ""|openflow|postgres|password|secret|changeme|change-me|replace-me|replace-with*)
            echo "Refusing to start Postgres: POSTGRES_PASSWORD is missing or a default. Set a dedicated POSTGRES_PASSWORD. Do not reuse CREDENTIALS_KEY." >&2
            exit 1
            ;;
        esac
        exec docker-entrypoint.sh postgres
    restart: unless-stopped

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pw=$$(printf '%s' "$$REDIS_PASSWORD" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        case "$$pw" in
          ""|openflow|redis|password|secret|changeme|change-me|replace-me|replace-with*)
            echo "Refusing to start Redis: REDIS_PASSWORD is missing or a default." >&2
            exit 1
            ;;
        esac
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    restart: unless-stopped

  toolbox:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a non-default value}@db:5432/${POSTGRES_DB:-openflow}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
