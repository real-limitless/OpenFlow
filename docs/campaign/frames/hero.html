<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero — OpenFlow</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="frame-body">
    <div class="canvas" id="frame">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-name">open<span>-flow</span></div>
        </div>
        <div class="meta-pills">
          <span class="pill accent">Canvas rail</span>
          <span class="pill on">Editor</span>
        </div>
      </header>

      <div class="inv-rail" aria-label="Canvas rail">
        <div class="inv-slot gw"><span class="role">Trigger</span><span class="host">node</span><span class="led"></span></div>
        <div class="inv-slot ok"><span class="role">Logic</span><span class="host">node</span><span class="led"></span></div>
        <div class="inv-slot ok"><span class="role">Action</span><span class="host">node</span><span class="led"></span></div>
        <div class="inv-slot sealed"><span class="role">Gallery</span><span class="host">modules</span><span class="led"></span></div>
        <div class="inv-slot empty"><span class="role">Run</span><span class="host">job</span><span class="led"></span></div>
      </div>
      <div class="main two-col" style="margin-top: 28px">
        <div class="stack" style="gap: 22px; padding-top: 8px">
          <div>
            <p class="eyebrow">OpenFlow · visual workflows</p>
            <h1 class="display">Draw the work.<br /><em>Run it on a canvas.</em></h1>
          </div>
          <p class="lede">Lime accent on the family chassis. The editor keeps its canvas. Chrome wears the tokens.</p>
        </div>
      </div>

      <footer class="frame-foot">
        <span>Campaign</span>
        <span>Hero — OpenFlow</span>
      </footer>
    </div>
  </body>
</html>
