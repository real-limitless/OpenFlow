apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openflow.fullname" . }}
  labels:
    {{- include "openflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  CREDENTIALS_KEY: {{ .Values.secrets.credentialsKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ include "openflow.databaseUrl" . | quote }}
  REDIS_URL: {{ include "openflow.redisUrl" . | quote }}
