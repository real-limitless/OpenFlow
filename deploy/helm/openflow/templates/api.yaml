apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openflow.fullname" . }}-api
  labels:
    {{- include "openflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: AUTH_DISABLED
              value: {{ .Values.secrets.authDisabled | quote }}
            - name: OPENFLOW_ROLE
              value: {{ .Values.api.role | quote }}
            - name: RUN_WORKER
              value: {{ .Values.api.runWorker | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflow.fullname" . }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflow.fullname" . }}
                  key: REDIS_URL
            - name: CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openflow.fullname" . }}
                  key: CREDENTIALS_KEY
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openflow.fullname" . }}-api
  labels:
    {{- include "openflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
