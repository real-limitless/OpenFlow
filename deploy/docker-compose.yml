# Image-based deploy (no local build). Used by scripts/install.sh and bare-metal hosts.
#
#   export OPENFLOW_IMAGE=ghcr.io/<owner>/openflow:latest
#   export REDIS_PASSWORD="$(openssl rand -hex 24)"
#   docker compose -f deploy/docker-compose.yml up -d
#
# The API is not published on a host port. Put a reverse proxy on the `api`
# network. Plain local use (loopback only):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local-ports.yml up -d
#
# Or from this directory after copying .env:
#   cp ../.env.example .env   # then set CREDENTIALS_KEY and REDIS_PASSWORD
#   docker compose up -d

name: openflow

services:
  api:
    image: ${OPENFLOW_IMAGE:-ghcr.io/real-limitless/openflow:latest}
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Dev default database password. Set POSTGRES_PASSWORD and NODE_ENV=production
      # for a real deploy. DATABASE_URL is built from POSTGRES_*; do not reuse
      # CREDENTIALS_KEY as the password.
      OPENFLOW_BUILD_DATABASE_URL: "1"
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openflow}
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-openflow}:${POSTGRES_PASSWORD:-openflow}@db:5432/${POSTGRES_DB:-openflow}
      NODE_ENV: ${NODE_ENV:-development}
      OPENFLOW_BUILD_REDIS_URL: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OPENFLOW_OPEN_REGISTER: ${OPENFLOW_OPEN_REGISTER:-false}
      OPENFLOW_ALLOW_FIRST_OWNER: ${OPENFLOW_ALLOW_FIRST_OWNER:-false}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      BINARY_STORAGE_DIR: /data/binary
      OPENFLOW_SECRETS_DIR: /data/secrets
      RUN_WORKER: ${RUN_WORKER:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      OPENFLOW_HOT_NODES: ${OPENFLOW_HOT_NODES:-false}
      OPENFLOW_ASSISTANT_ENABLED: ${OPENFLOW_ASSISTANT_ENABLED:-true}
      OPENFLOW_ASSISTANT_BACKEND: ${OPENFLOW_ASSISTANT_BACKEND:-builtin}
      OPENFLOW_ASSISTANT_API_KEY: ${OPENFLOW_ASSISTANT_API_KEY:-}
      OPENFLOW_ASSISTANT_BASE_URL: ${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}
      OPENFLOW_ASSISTANT_MODEL: ${OPENFLOW_ASSISTANT_MODEL:-openai/gpt-4o-mini}
      OPENFLOW_MCP_ENABLED: ${OPENFLOW_MCP_ENABLED:-true}
      OPENFLOW_PUBLIC_URL: ${OPENFLOW_PUBLIC_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - binary-data:/data/binary
      - secrets-data:/data/secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    internal: true
  api: {}

volumes:
  pgdata:
  binary-data:
  secrets-data:
  redis-data:
