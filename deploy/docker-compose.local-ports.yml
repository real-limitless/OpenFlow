# Opt-in loopback port for plain local use.
# deploy/docker-compose.yml does not publish the API. Put a reverse proxy on
# the `api` network for anything else.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local-ports.yml up -d
#
# INSECURE if the host is reachable past loopback and AUTH_DISABLED=true.

services:
  api:
    ports:
      - "127.0.0.1:${OPENFLOW_PORT:-3000}:3000"
