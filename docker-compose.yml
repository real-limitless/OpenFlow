# OpenFlow stack.
#   cp .env.example .env
#   # REDIS_PASSWORD is required (no default). POSTGRES_PASSWORD defaults to
#   # the dev-only value openflow until the prod overlay.
#   docker compose up -d --build
#
# The API is not published on a host port. Routing belongs on the `api`
# network (reverse proxy). Loopback UI:
#   docker compose -f docker-compose.yml -f docker-compose.local-ports.yml up -d
# Host ports for Postgres/Redis are opt-in (not for production):
#   docker compose -f docker-compose.yml -f docker-compose.debug-ports.yml up -d db redis
#
# Auth, hot-node reload, and public registration default off.
# INSECURE local try-out (no login): set AUTH_DISABLED=true in .env.
# Headless owner: OPENFLOW_BOOTSTRAP_OWNER_EMAIL and
# OPENFLOW_BOOTSTRAP_OWNER_PASSWORD_FILE. That does not open public signup.
# Public first owner remains OPENFLOW_ALLOW_FIRST_OWNER=true (or
# OPENFLOW_OPEN_REGISTER=true), then POST /api/v1/auth/register.
#
# Toolbox (git/shell/RAG reindex) starts with the stack:
#   docker compose exec toolbox bash
#   docker compose exec toolbox catalog-reindex-hash
#
# Production: set POSTGRES_PASSWORD and REDIS_PASSWORD (do not reuse
# CREDENTIALS_KEY), then
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

# Dev-only Postgres defaults. The prod overlay requires POSTGRES_PASSWORD
# and refuses this password. DATABASE_URL is rebuilt by the entrypoint so
# the password is percent-encoded. A host .env DATABASE_URL (localhost:15432)
# must not leak into containers — these keys override env_file.
x-postgres-app: &postgres-app
  OPENFLOW_BUILD_DATABASE_URL: "1"
  POSTGRES_USER: ${POSTGRES_USER:-openflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openflow}
  POSTGRES_DB: ${POSTGRES_DB:-openflow}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql://${POSTGRES_USER:-openflow}:${POSTGRES_PASSWORD:-openflow}@db:5432/${POSTGRES_DB:-openflow}
  # The image bakes NODE_ENV=production, which refuses the dev password and
  # exits before /health exists. This stack must not inherit that.
  NODE_ENV: development

x-redis-app: &redis-app
  OPENFLOW_BUILD_REDIS_URL: "1"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379

services:
  api:
    build: .
    image: openflow:local
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*postgres-app, *redis-app]
      # Auth on by default. INSECURE local try-out only: AUTH_DISABLED=true
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OPENFLOW_OPEN_REGISTER: ${OPENFLOW_OPEN_REGISTER:-false}
      OPENFLOW_ALLOW_FIRST_OWNER: ${OPENFLOW_ALLOW_FIRST_OWNER:-false}
      OPENFLOW_BOOTSTRAP_API_KEY: ${OPENFLOW_BOOTSTRAP_API_KEY:-}
      OPENFLOW_BOOTSTRAP_API_KEY_FILE: ${OPENFLOW_BOOTSTRAP_API_KEY_FILE:-}
      OPENFLOW_BOOTSTRAP_SCOPES: ${OPENFLOW_BOOTSTRAP_SCOPES:-}
      OPENFLOW_BOOTSTRAP_OWNER_EMAIL: ${OPENFLOW_BOOTSTRAP_OWNER_EMAIL:-}
      OPENFLOW_BOOTSTRAP_OWNER_PASSWORD_FILE: ${OPENFLOW_BOOTSTRAP_OWNER_PASSWORD_FILE:-}
      OPENFLOW_IMPORT_DIR: ${OPENFLOW_IMPORT_DIR:-}
      OPENFLOW_IMPORT_ACTIVATE: ${OPENFLOW_IMPORT_ACTIVATE:-}
      # Optional OIDC (authorization-code + PKCE). Also configurable in Settings → SSO.
      OPENFLOW_OIDC_ISSUER: ${OPENFLOW_OIDC_ISSUER:-}
      OPENFLOW_OIDC_CLIENT_ID: ${OPENFLOW_OIDC_CLIENT_ID:-}
      OPENFLOW_OIDC_CLIENT_SECRET: ${OPENFLOW_OIDC_CLIENT_SECRET:-}
      OPENFLOW_OIDC_REDIRECT_URI: ${OPENFLOW_OIDC_REDIRECT_URI:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      # Fixed container paths (do not interpolate host .env — breaks the volume mounts)
      BINARY_STORAGE_DIR: /data/binary
      OPENFLOW_SECRETS_DIR: /data/secrets
      OPENFLOW_WORKSPACE_DIR: /data/workspace
      OPENFLOW_ROLE: ${OPENFLOW_ROLE:-main}
      RUN_WORKER: ${RUN_WORKER:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      OPENFLOW_HOT_NODES: ${OPENFLOW_HOT_NODES:-false}
      OPENFLOW_ASSISTANT_ENABLED: ${OPENFLOW_ASSISTANT_ENABLED:-true}
      OPENFLOW_ASSISTANT_BACKEND: ${OPENFLOW_ASSISTANT_BACKEND:-builtin}
      OPENFLOW_ASSISTANT_MAX_STEPS: ${OPENFLOW_ASSISTANT_MAX_STEPS:-24}
      OPENFLOW_ASSISTANT_API_KEY: ${OPENFLOW_ASSISTANT_API_KEY:-}
      OPENFLOW_ASSISTANT_BASE_URL: ${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}
      OPENFLOW_ASSISTANT_MODEL: ${OPENFLOW_ASSISTANT_MODEL:-openai/gpt-4o-mini}
      OPENFLOW_MCP_ENABLED: ${OPENFLOW_MCP_ENABLED:-true}
      OPENFLOW_PUBLIC_URL: ${OPENFLOW_PUBLIC_URL:-}
      OPENFLOW_CATALOG_RAG_ENABLED: ${OPENFLOW_CATALOG_RAG_ENABLED:-true}
      OPENFLOW_CATALOG_EMBED_API_KEY: ${OPENFLOW_CATALOG_EMBED_API_KEY:-${OPENFLOW_ASSISTANT_API_KEY:-}}
      OPENFLOW_CATALOG_EMBED_BASE_URL: ${OPENFLOW_CATALOG_EMBED_BASE_URL:-${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}}
      OPENFLOW_CATALOG_EMBED_MODEL: ${OPENFLOW_CATALOG_EMBED_MODEL:-text-embedding-3-small}
      OPENFLOW_CATALOG_EMBED_DIMS: ${OPENFLOW_CATALOG_EMBED_DIMS:-1536}
      OPENFLOW_CATALOG_EMBED_BATCH: ${OPENFLOW_CATALOG_EMBED_BATCH:-32}
      OPENFLOW_CATALOG_EMBED_CONCURRENCY: ${OPENFLOW_CATALOG_EMBED_CONCURRENCY:-4}
      OPENFLOW_CATALOG_EMBED_NO_AUTH: ${OPENFLOW_CATALOG_EMBED_NO_AUTH:-}
      OPENFLOW_CATALOG_SHELL_PENALTY: ${OPENFLOW_CATALOG_SHELL_PENALTY:-0.35}
      OPENFLOW_CATALOG_USE_PGVECTOR: ${OPENFLOW_CATALOG_USE_PGVECTOR:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OPENCODE_HOSTNAME: ${OPENCODE_HOSTNAME:-127.0.0.1}
      OPENCODE_PORT: ${OPENCODE_PORT:-4096}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - binary-data:/data/binary
      - secrets-data:/data/secrets
      - workspace-data:/data/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend
      - api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Do not depend on api health. The API used to exit on the dev DB password
  # (image NODE_ENV=production) and this container stayed Created forever, so
  # queued, webhook, and scheduled runs never ran. Migrations run in this
  # entrypoint; Postgres and Redis being healthy is enough to start.
  # Same image as api. One build target only: a second `build:` races
  # `docker compose up --build` and fails with "image already exists".
  worker:
    image: openflow:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*postgres-app, *redis-app]
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OPENFLOW_OPEN_REGISTER: ${OPENFLOW_OPEN_REGISTER:-false}
      OPENFLOW_ALLOW_FIRST_OWNER: ${OPENFLOW_ALLOW_FIRST_OWNER:-false}
      OPENFLOW_HOT_NODES: ${OPENFLOW_HOT_NODES:-false}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      BINARY_STORAGE_DIR: /data/binary
      OPENFLOW_SECRETS_DIR: /data/secrets
      OPENFLOW_WORKSPACE_DIR: /data/workspace
      OPENFLOW_ROLE: worker
      RUN_WORKER: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    volumes:
      - binary-data:/data/binary
      - secrets-data:/data/secrets
      - workspace-data:/data/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend
      - api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Toolbox: git/bash/python + baked-in app for catalog RAG.
  # App lives at /app (in the image). /data/workspace is agent scratch (shared with api).
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.toolbox
    image: openflow-toolbox:local
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*postgres-app, *redis-app]
      OPENFLOW_APP_DIR: /app
      OPENFLOW_WORKSPACE_DIR: /data/workspace
      OPENFLOW_CATALOG_RAG_ENABLED: ${OPENFLOW_CATALOG_RAG_ENABLED:-true}
      OPENFLOW_CATALOG_EMBED_API_KEY: ${OPENFLOW_CATALOG_EMBED_API_KEY:-${OPENFLOW_ASSISTANT_API_KEY:-}}
      OPENFLOW_CATALOG_EMBED_BASE_URL: ${OPENFLOW_CATALOG_EMBED_BASE_URL:-${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}}
      OPENFLOW_CATALOG_EMBED_MODEL: ${OPENFLOW_CATALOG_EMBED_MODEL:-text-embedding-3-small}
      OPENFLOW_CATALOG_EMBED_DIMS: ${OPENFLOW_CATALOG_EMBED_DIMS:-1536}
      OPENFLOW_CATALOG_EMBED_BATCH: ${OPENFLOW_CATALOG_EMBED_BATCH:-32}
      OPENFLOW_CATALOG_EMBED_CONCURRENCY: ${OPENFLOW_CATALOG_EMBED_CONCURRENCY:-4}
      OPENFLOW_CATALOG_EMBED_NO_AUTH: ${OPENFLOW_CATALOG_EMBED_NO_AUTH:-}
      OPENFLOW_CATALOG_SHELL_PENALTY: ${OPENFLOW_CATALOG_SHELL_PENALTY:-0.35}
      OPENFLOW_CATALOG_USE_PGVECTOR: ${OPENFLOW_CATALOG_USE_PGVECTOR:-true}
      OPENFLOW_ASSISTANT_API_KEY: ${OPENFLOW_ASSISTANT_API_KEY:-}
      OPENFLOW_ASSISTANT_BASE_URL: ${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      # Agent scratch only — NOT the OpenFlow source tree
      - workspace-data:/data/workspace
      - catalog-data:/data/catalog
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - api
    restart: unless-stopped

  db:
    # pgvector-enabled Postgres for semantic node catalog (RAG)
    image: pgvector/pgvector:pg16
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openflow}
      POSTGRES_USER: ${POSTGRES_USER:-openflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  # db and redis only. No host ports and no egress.
  backend:
    internal: true
  # api, worker, and toolbox. A reverse proxy attaches here.
  api: {}

volumes:
  pgdata:
  binary-data:
  secrets-data:
  redis-data:
  workspace-data:
  catalog-data:
