# OpenFlow — local try-out stack
#   docker compose up -d
#   open http://localhost:3000
#
# Toolbox (git/shell/RAG reindex) starts with the stack:
#   docker compose exec toolbox bash
#   docker compose exec toolbox catalog-reindex-hash
#
# No .env required. Optional: cp .env.example .env and edit.
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build: .
    image: openflow:local
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://openflow:openflow@db:5432/openflow
      REDIS_URL: redis://redis:6379
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      # Fixed container paths (do not interpolate host .env — breaks the volume mounts)
      BINARY_STORAGE_DIR: /data/binary
      OPENFLOW_SECRETS_DIR: /data/secrets
      OPENFLOW_WORKSPACE_DIR: /data/workspace
      RUN_WORKER: ${RUN_WORKER:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      OPENFLOW_HOT_NODES: ${OPENFLOW_HOT_NODES:-true}
      OPENFLOW_ASSISTANT_ENABLED: ${OPENFLOW_ASSISTANT_ENABLED:-true}
      OPENFLOW_ASSISTANT_BACKEND: ${OPENFLOW_ASSISTANT_BACKEND:-builtin}
      OPENFLOW_ASSISTANT_MAX_STEPS: ${OPENFLOW_ASSISTANT_MAX_STEPS:-24}
      OPENFLOW_ASSISTANT_API_KEY: ${OPENFLOW_ASSISTANT_API_KEY:-}
      OPENFLOW_ASSISTANT_BASE_URL: ${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}
      OPENFLOW_ASSISTANT_MODEL: ${OPENFLOW_ASSISTANT_MODEL:-openai/gpt-4o-mini}
      OPENFLOW_MCP_ENABLED: ${OPENFLOW_MCP_ENABLED:-true}
      OPENFLOW_PUBLIC_URL: ${OPENFLOW_PUBLIC_URL:-}
      OPENFLOW_CATALOG_RAG_ENABLED: ${OPENFLOW_CATALOG_RAG_ENABLED:-true}
      OPENFLOW_CATALOG_EMBED_API_KEY: ${OPENFLOW_CATALOG_EMBED_API_KEY:-${OPENFLOW_ASSISTANT_API_KEY:-}}
      OPENFLOW_CATALOG_EMBED_BASE_URL: ${OPENFLOW_CATALOG_EMBED_BASE_URL:-${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}}
      OPENFLOW_CATALOG_EMBED_MODEL: ${OPENFLOW_CATALOG_EMBED_MODEL:-text-embedding-3-small}
      OPENFLOW_CATALOG_EMBED_DIMS: ${OPENFLOW_CATALOG_EMBED_DIMS:-1536}
      OPENFLOW_CATALOG_EMBED_BATCH: ${OPENFLOW_CATALOG_EMBED_BATCH:-32}
      OPENFLOW_CATALOG_EMBED_CONCURRENCY: ${OPENFLOW_CATALOG_EMBED_CONCURRENCY:-4}
      OPENFLOW_CATALOG_EMBED_NO_AUTH: ${OPENFLOW_CATALOG_EMBED_NO_AUTH:-}
      OPENFLOW_CATALOG_SHELL_PENALTY: ${OPENFLOW_CATALOG_SHELL_PENALTY:-0.35}
      OPENFLOW_CATALOG_USE_PGVECTOR: ${OPENFLOW_CATALOG_USE_PGVECTOR:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OPENCODE_HOSTNAME: ${OPENCODE_HOSTNAME:-127.0.0.1}
      OPENCODE_PORT: ${OPENCODE_PORT:-4096}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - binary-data:/data/binary
      - secrets-data:/data/secrets
      - workspace-data:/data/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Toolbox: git/bash/python + baked-in app for catalog RAG.
  # App lives at /app (in the image). /data/workspace is agent scratch (shared with api).
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.toolbox
    image: openflow-toolbox:local
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://openflow:openflow@db:5432/openflow
      REDIS_URL: redis://redis:6379
      OPENFLOW_APP_DIR: /app
      OPENFLOW_WORKSPACE_DIR: /data/workspace
      OPENFLOW_CATALOG_RAG_ENABLED: ${OPENFLOW_CATALOG_RAG_ENABLED:-true}
      OPENFLOW_CATALOG_EMBED_API_KEY: ${OPENFLOW_CATALOG_EMBED_API_KEY:-${OPENFLOW_ASSISTANT_API_KEY:-}}
      OPENFLOW_CATALOG_EMBED_BASE_URL: ${OPENFLOW_CATALOG_EMBED_BASE_URL:-${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}}
      OPENFLOW_CATALOG_EMBED_MODEL: ${OPENFLOW_CATALOG_EMBED_MODEL:-text-embedding-3-small}
      OPENFLOW_CATALOG_EMBED_DIMS: ${OPENFLOW_CATALOG_EMBED_DIMS:-1536}
      OPENFLOW_CATALOG_EMBED_BATCH: ${OPENFLOW_CATALOG_EMBED_BATCH:-32}
      OPENFLOW_CATALOG_EMBED_CONCURRENCY: ${OPENFLOW_CATALOG_EMBED_CONCURRENCY:-4}
      OPENFLOW_CATALOG_EMBED_NO_AUTH: ${OPENFLOW_CATALOG_EMBED_NO_AUTH:-}
      OPENFLOW_CATALOG_SHELL_PENALTY: ${OPENFLOW_CATALOG_SHELL_PENALTY:-0.35}
      OPENFLOW_CATALOG_USE_PGVECTOR: ${OPENFLOW_CATALOG_USE_PGVECTOR:-true}
      OPENFLOW_ASSISTANT_API_KEY: ${OPENFLOW_ASSISTANT_API_KEY:-}
      OPENFLOW_ASSISTANT_BASE_URL: ${OPENFLOW_ASSISTANT_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      # Agent scratch only — NOT the OpenFlow source tree
      - workspace-data:/data/workspace
      - catalog-data:/data/catalog
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # pgvector-enabled Postgres for semantic node catalog (RAG)
    image: pgvector/pgvector:pg16
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openflow
      POSTGRES_USER: openflow
      POSTGRES_PASSWORD: openflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openflow -d openflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  binary-data:
  secrets-data:
  redis-data:
  workspace-data:
  catalog-data:
